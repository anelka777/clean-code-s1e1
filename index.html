<!DOCTYPE html>
<html>
<head>
  <title>Todo App</title>
  <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
  <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
</head>
<body class="whole-app">
  <header class="header">
    <img class="header-image" src="./eisenhower-matrix.jpg">
    <a class="more-info" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
  </header>
  <main class="todo-app">
    <section id="add-task-section">
      <h3 class="add-item-title">Add Item</h3>
      <label class="new-task-label" for="new-task"></label>
      <div class="task-row-wrapper">
        <input id="new-task" class="new-task-title" type="text">
        <button class="task-button">Add</button>
      </div>
    </section>
    <section>
      <h3 class="section-title">Todo</h3>
      <ul class="task-list" id="incomplete-tasks">
        <li class="task-list__item">
          <input class="task-list__checkbox" type="checkbox">
          <label class="task-title">Pay Bills</label>
          <input type="text" class="task-list__input">
          <button class="edit task-button">Edit</button>
          <button class="delete task-button">
            <img class="task-button-img" src="./remove.svg">
          </button>
        </li>
        <li class="edit-mode task-list__item">
          <input class="task-list__checkbox" type="checkbox">
          <label class="task-title">Go Shopping</label>
          <input type="text" value="Go Shopping" class="task-list__input">
          <button class="edit task-button">Save</button>
          <button class="delete task-button">
            <img class="task-button-img" src="./remove.svg">
          </button>
        </li>
      </ul>
    </section>
    <section>
      <h3 class="section-title">Completed</h3>
      <ul class="task-list" id="completed-tasks">
        <li class="task-list__item">
          <input class="task-list__checkbox" type="checkbox" checked>
          <label class="task-title">See the Doctor</label>
          <input type="text" class="task-list__input">
          <button class="edit task-button">Edit</button>
          <button class="delete task-button">
            <img class="task-button-img" src="./remove.svg">
          </button>
        </li>
      </ul>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
