<!DOCTYPE html>
<html>
<head>
  <title>Todo App</title>
  <link href="https://fonts.googleapis.com/css?family=Lato:300,400,700" rel="stylesheet">
  <link rel="stylesheet" href="style.css" media="screen" charset="utf-8">
</head>
<body class="whole-app">
  <header class="header">
    <img class="header__image" src="./eisenhower-matrix.jpg" alt="the eisenhower matrix">
    <a class="header__more-info" href="https://goal-life.com/page/method/matrix-eisenhower">Want more details?</a>
  </header>
  <main class="todo-app">
    <section id="add-task">
      <h3 class="add-task__title">Add Item</h3>
      <label class="add-task__label" for="new-task"></label>
      <div class="task-row-wrapper">
        <input id="new-task" class="new-task__input" type="text">
        <button class="task-list__button">Add</button>
      </div>
    </section>
    <section>
      <h3 class="section__title">Todo</h3>
      <ul class="task-list" id="incomplete-tasks">
        <li class="task-list__item">
          <input class="task-list__checkbox" type="checkbox">
          <label class="task-list__title">Pay Bills</label>
          <input type="text" class="task-list__input">
          <button class="edit task-list__button">Edit</button>
          <button class="delete task-list__button">
            <img class="button__img" src="./remove.svg" alt="remove button">
          </button>
        </li>
        <li class="task-list__item task-list__item--edit-mode">
          <input class="task-list__checkbox" type="checkbox">
          <label class="task-list__title">Go Shopping</label>
          <input type="text" value="Go Shopping" class="task-list__input">
          <button class="edit task-list__button">Save</button>
          <button class="delete task-list__button">
            <img class="button__img" src="./remove.svg" alt="remove button">
          </button>
        </li>
      </ul>
    </section>
    <section>
      <h3 class="section__title">Completed</h3>
      <ul class="task-list" id="completed-tasks">
        <li class="task-list__item">
          <input class="task-list__checkbox" type="checkbox" checked>
          <label class="task-list__title">See the Doctor</label>
          <input type="text" class="task-list__input">
          <button class="edit task-list__button">Edit</button>
          <button class="delete task-list__button">
            <img class="button__img" src="./remove.svg" alt="remove button">
          </button>
        </li>
      </ul>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
